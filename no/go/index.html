<!DOCTYPE html>
<html lang="nb-NO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Laster tilbudet …</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#fff;color:#333}
  .s{text-align:center}
  .r{width:38px;height:38px;margin:0 auto 14px;border:3px solid #e6e6e6;border-top-color:#111;
      border-radius:50%;animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.r{animation:none}}
</style>
</head>
<body>
<div class="s"><div class="r"></div><p>Laster tilbudet …</p></div>
<script src="/assets/links.js"></script>
<script>
(function () {
  var GEO = "no";
  var L = (window.WEGO6_LINKS || {})[GEO] || {};
  var BASE = L.base || "";
  var sub1 = L.org || "wego6";

  // A paid visitor's click-id takes the sub1 slot so the conversion can be matched
  // back to the ad platform; organic visitors carry the country tag instead.
  try {
    var t = JSON.parse(localStorage.getItem("w6_track") || "{}");
    var cid = t.gclid || t.gbraid || t.wbraid || t.fbclid || t.ttclid || t.msclkid;
    if (cid) sub1 = cid;
  } catch (e) {}

  // No link configured yet (UK until the advertiser sends it) — send the visitor
  // back to the country hub rather than leaving them on a dead spinner.
  if (!BASE) { window.location.replace("/no/"); return; }

  var url = BASE + (BASE.indexOf("?") > -1 ? "&" : "?") + "sub1=" + encodeURIComponent(sub1);
  var hop = window.WEGO6_HOP;
  if (hop) url = hop + (hop.indexOf("?") > -1 ? "&" : "?") + "u=" + encodeURIComponent(url);
  setTimeout(function () { window.location.replace(url); }, 200);
})();
</script>
</body>
</html>
